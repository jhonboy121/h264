[package]
name = "h264"
version = "0.0.1"
edition = "2024"
description = "Pure-Rust port of Cisco OpenH264"

[features]
default = ["std", "decoder", "encoder"]
std = []
decoder = []
encoder = []
simd = []
threads = ["std"]
# Opt-in: route YUV->RGB(A) conversion through the SIMD `yuv` crate, which
# honors BT.601/709/2020 + full/limited range. Pulls in `yuv` and forces `std`
# (the `yuv` crate is not `no_std`). The default build stays zero-dep + no_std.
yuv-convert = ["dep:yuv", "std"]

[dependencies]
yuv = { version = "0.8", optional = true }

[dev-dependencies]

[profile.opt]
inherits = "release"
strip = true
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
